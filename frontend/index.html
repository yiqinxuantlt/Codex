<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#71806b" />
    <meta name="application-name" content="阅读笔记回顾" />
    <title>阅读笔记回顾</title>
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("reading-note-reviewer-theme");
          document.documentElement.dataset.theme = saved === "night" ? "night" : "paper";
        } catch (_) {
          document.documentElement.dataset.theme = "paper";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
